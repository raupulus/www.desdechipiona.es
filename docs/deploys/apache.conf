# Configuración de Apache para Desde Chipiona en producción
# *Última actualización: 2026-11-04*
# Archivo: /etc/apache2/sites-available/desdechipiona.conf
# Activar: sudo a2ensite desdechipiona.conf && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName desdechipiona.es
    ServerAlias www.desdechipiona.es

    # Redirigir HTTP a HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName desdechipiona.es
    ServerAlias www.desdechipiona.es

    # Directorio raíz — apuntar al directorio public de Laravel
    DocumentRoot /var/www/desdechipiona/public

    # Certificados SSL
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/desdechipiona.es/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/desdechipiona.es/privkey.pem

    # Tamaño máximo de subida
    LimitRequestBody 52428800

    <Directory /var/www/desdechipiona/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Soporte para URLs amigables de Laravel
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    # Denegar acceso a archivos sensibles
    <FilesMatch "(\.env|\.htaccess|composer\.lock|package\.json|pnpm-lock\.yaml)">
        Require all denied
    </FilesMatch>

    # Cabeceras de seguridad
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Compresión Deflate
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css application/javascript application/json image/svg+xml
    </IfModule>

    # Caché de assets estáticos (1 año)
    <LocationMatch "\.(jpg|jpeg|png|gif|ico|webp|avif|css|js|woff|woff2|svg|webmanifest)$">
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
        Header append Cache-Control "public, immutable"
    </LocationMatch>

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/desdechipiona_error.log
    CustomLog ${APACHE_LOG_DIR}/desdechipiona_access.log combined
</VirtualHost>
