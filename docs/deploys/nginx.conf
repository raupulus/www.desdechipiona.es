# Configuración de Nginx para Desde Chipiona en producción
# *Última actualización: 2026-11-05*
# Ruta: /etc/nginx/sites-available/desdechipiona
# Activar: sudo ln -s /etc/nginx/sites-available/desdechipiona /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name desdechipiona.es www.desdechipiona.es;

    # Redirigir HTTP a HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name desdechipiona.es www.desdechipiona.es;

    # Directorio raíz — apuntar al directorio public de Laravel
    root /var/www/desdechipiona/public;
    index index.php;

    # Certificados SSL (usando Certbot/Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/desdechipiona.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/desdechipiona.es/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Tamaño máximo de subida de archivos
    client_max_body_size 50M;

    # Compresión Gzip para respuestas y assets estáticos
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml application/manifest+json;

    # Cabeceras de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # Caché de assets estáticos (repite cabeceras de seguridad para no perder herencia en Nginx)
    location ~* \.(jpg|jpeg|png|gif|ico|webp|avif|css|js|woff|woff2|ttf|svg|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        try_files $uri =404;
    }

    # Manejar todas las peticiones a través del index.php de Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Procesar archivos PHP con PHP-FPM
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Denegar acceso a archivos .htaccess y .env
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Bloquear ejecución de archivos PHP en el directorio de uploads (seguridad)
    location ~* /storage/.*\.php$ {
        deny all;
    }

    # Logs
    access_log /var/log/nginx/desdechipiona_access.log;
    error_log /var/log/nginx/desdechipiona_error.log;
}
